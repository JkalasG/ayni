<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const SC = new URLSearchParams(location.search).get("scene") || window.__SCENE || "s01-story";
const TM = (window.__TIMINGS || []).map((t) => ({ start: t.start + 0.35, end: t.end + 0.35 }));
window.__cues = [];
let t0 = null;
const timers = [];
const at = (sec, fn) => timers.push(setTimeout(fn, Math.max(0, sec * 1000 - (performance.now() - t0))));
const cue = (name, sec, gain = 1) => window.__cues.push({ sfx: name, at: sec, gain });
const anim = (el, kf, dur, opt = {}) => el.animate(kf, { duration: dur * 1000, fill: "forwards", easing: "cubic-bezier(.2,.8,.2,1)", ...opt });
const fadeIn = (el, sec = 0.5) => anim(el, [{ opacity: 0 }, { opacity: 1 }], sec);
const fadeOut = (el, sec = 0.5) => anim(el, [{ opacity: 1 }, { opacity: 0 }], sec);
const caption = (text, sec, hold = 2.6) => {
  at(sec, () => {
    const s = document.querySelector("#cap span");
    s.textContent = text;
    anim(s, [{ opacity: 0, transform: "translateY(14px)" }, { opacity: 1, transform: "translateY(0)" }], 0.35);
    cue("tick", sec, 0.5);
    at(sec + hold, () => anim(s, [{ opacity: 1 }, { opacity: 0 }], 0.35));
  });
};
const slowZoom = (el, from, to, sec, cx = 640, cy = 400) => anim(el, [{ transform: `translate(${cx}px,${cy}px) scale(${from}) translate(${-cx}px,${-cy}px)` }, { transform: `translate(${cx}px,${cy}px) scale(${to}) translate(${-cx}px,${-cy}px)` }], sec, { easing: "linear" });

function mk(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function flyCoin(parent, from, to, sec, delay, arc = -140, big = 1) {
  const g = mk("g", { opacity: 0 }, parent);
  mk("use", { href: "#coin" }, g);
  at(sec + delay, () => {
    g.setAttribute("opacity", 1);
    anim(g, [
      { transform: `translate(${from[0]}px,${from[1]}px) scale(${big})`, opacity: 1 },
      { transform: `translate(${(from[0] + to[0]) / 2}px,${Math.min(from[1], to[1]) + arc}px) scale(${big * 1.1})`, opacity: 1, offset: 0.5 },
      { transform: `translate(${to[0]}px,${to[1]}px) scale(${big * 0.8})`, opacity: 0 },
    ], 0.8, { easing: "ease-in-out" });
  });
  return g;
}
function confetti(cx, cy, sec) {
  const colors = ["#FFD23F", "#29C6E0", "#FF8A1F", "#2FD49A", "#E8287A"];
  at(sec, () => {
    for (let i = 0; i < 26; i++) {
      const r = mk("rect", { width: 12, height: 12, fill: colors[i % 5] }, $("confetti"));
      const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 260;
      anim(r, [
        { transform: `translate(${cx}px,${cy}px) rotate(45deg)`, opacity: 1 },
        { transform: `translate(${cx + Math.cos(a) * d}px,${cy + Math.sin(a) * d - 80}px) rotate(${180 + i * 30}deg)`, opacity: 0 },
      ], 1.3 + Math.random() * 0.6, { easing: "cubic-bezier(.1,.7,.3,1)" });
    }
  });
}

function scene1() {
  // ---- sentence 0: "Meet Doña Rosa."
  fadeIn($("sc0"), 0.6);
  slowZoom($("stallzoom"), 1.0, 1.1, 30, 640, 420);
  cue("sparkle", 0.5);
  caption("Doña Rosa · street vendor · La Paz", TM[0].start + 0.3, 3.6);
  // she writes in her notebook
  at(TM[0].start + 0.9, () => anim($("notebook"), [{ transform: "translateY(0)" }, { transform: "translateY(-6px)" }, { transform: "translateY(0)" }], 0.8, { iterations: 3 }));

  // ---- sentence 1: "...she saves in a pasanaku."
  at(TM[1].start + 0.2, () => {
    fadeOut($("sc0"), 0.5);
    fadeIn($("sc1"), 0.6);
    slowZoom($("ringzoom"), 1.0, 1.05, 24, 640, 440);
    // the figures pop in one by one
    ["fig_back", "fig_boy", "fig_girl", "fig_grandpa", "fig_elder"].forEach((id, i) => {
      const g = $(id);
      g.style.opacity = 0;
      at(TM[1].start + 0.5 + i * 0.35, () => {
        anim(g, [{ opacity: 0, transform: "translateY(40px)" }, { opacity: 1, transform: "translateY(0)" }], 0.5);
        cue("pop", TM[1].start + 0.5 + i * 0.35, 0.7);
      });
    });
  });
  caption("A pasanaku: a savings circle", TM[1].start + 1.2, 3.2);

  // ---- sentence 2: everyone contributes, one takes the pot
  const hands = [[330, 440], [520, 470], [890, 470], [1070, 440], [700, 380]];
  const pot = [690, 500];
  hands.forEach((h, i) => {
    flyCoin($("coins"), h, pot, TM[2].start, 0.7 + i * 0.28);
    cue("coin", TM[2].start + 0.7 + i * 0.28 + 0.7, 0.8);
  });
  at(TM[2].start + 2.4, () => anim($("potlabel"), [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "translateY(0)" }], 0.4));
  caption("Same amount every round. One person takes the pot.", TM[2].start + 0.2, 4.2);
  // the pot goes to the boy
  at(TM[2].end - 1.4, () => {
    anim($("potA"), [{ transform: "translate(690px,520px)" }, { transform: "translate(500px,300px)" }, { transform: "translate(350px,330px)" }], 1.0, { easing: "ease-in-out" });
    cue("drop", TM[2].end - 1.4 + 1.0, 0.8);
    fadeOut($("potlabel"), 0.3);
    confetti(350, 330, TM[2].end - 0.5);
    cue("sparkle", TM[2].end - 0.5, 0.8);
  });

  // ---- sentence 3: "It runs on trust."
  at(TM[3].start, () => {
    for (let i = 0; i < 9; i++) {
      const h = mk("path", { d: "M0 -8 C-16 -26 -34 -4 0 20 C34 -4 16 -26 0 -8 Z", fill: i % 2 ? "#E8287A" : "#FFD23F", opacity: 0 }, $("hearts"));
      const x = 280 + i * 100, y = 250 + (i % 3) * 30;
      at(TM[3].start + i * 0.12, () => anim(h, [{ transform: `translate(${x}px,${y + 90}px) scale(.5)`, opacity: 0 }, { transform: `translate(${x}px,${y}px) scale(1.1)`, opacity: 1, offset: 0.4 }, { transform: `translate(${x}px,${y - 80}px) scale(1)`, opacity: 0 }], 1.6));
    }
    cue("sparkle", TM[3].start + 0.2, 0.6);
  });
  caption("It runs on trust", TM[3].start + 0.1, 2.0);

  // ---- sentence 4: "...the first person to get the pot stopped answering."
  at(TM[4].start, () => {
    fadeIn($("chat"), 0.4);
    cue("notify", TM[4].start + 0.3, 0.8);
    anim($("dots"), [{ opacity: 1 }, { opacity: 0.2 }, { opacity: 1 }], 1.2, { iterations: 4 });
  });
  caption("…until someone stopped answering", TM[4].start + 0.4, 3.6);
  at(TM[4].start + 1.0, () => {
    // the boy walks away with the pot
    anim($("fig_boy"), [{ transform: "translateX(0)" }, { transform: "translateX(1100px)" }], 3.4, { easing: "ease-in" });
    anim($("potA"), [{ transform: "translate(350px,330px)" }, { transform: "translate(1450px,330px)" }], 3.4, { easing: "ease-in" });
    cue("whoosh", TM[4].start + 1.0, 0.5);
    cue("sad", TM[4].start + 2.6, 0.9);
  });

  // ---- sentence 5: Rosa pays from her pocket
  at(TM[5].start - 0.1, () => {
    fadeOut($("chat"), 0.4);
    fadeOut($("sc1"), 0.5);
    fadeIn($("sc5"), 0.5);
    anim($("missing"), [{ opacity: 0 }, { opacity: 1 }], 0.4);
  });
  // Rosa stays in the picture: she is drawn again, large, on the right
  const rosa = mk("use", { href: "#elder", x: 900, y: 190, width: 190, height: 430 }, $("sc5"));
  rosa.setAttribute("opacity", 0);
  at(TM[5].start - 0.1, () => anim(rosa, [{ opacity: 0 }, { opacity: 1 }], 0.5));
  at(TM[5].start + 0.6, () => anim($("pocket"), [{ opacity: 0 }, { opacity: 1 }], 0.4));
  for (let i = 0; i < 6; i++) {
    flyCoin($("coins5"), [995, 420], [300, 500], TM[5].start, 0.9 + i * 0.3, -180, 1.1);
    cue("coin", TM[5].start + 0.9 + i * 0.3 + 0.7, 0.8);
  }
  caption("She covered it from her own pocket", TM[5].start + 0.2, 3.0);

  // ---- sentence 6: two cities
  at(TM[6].start, () => {
    fadeOut($("sc5"), 0.4);
    fadeIn($("sc6"), 0.5);
  });
  at(TM[6].start + 2.2, () => {
    $("trail").setAttribute("opacity", 1);
    anim($("bill"), [{ transform: "translate(470px,400px)" }, { transform: "translate(560px,360px)" }, { transform: "translate(590px,400px)" }, { transform: "translate(500px,410px)" }], 1.4, { easing: "ease-in-out" });
    at(TM[6].start + 3.1, () => { anim($("wall"), [{ opacity: 0, transform: "scale(.4)" }, { opacity: 1, transform: "scale(1)" }], 0.3); cue("sad", TM[6].start + 3.1, 0.5); });
  });
  caption("Cash only: her daughter in Madrid can't join", TM[6].start + 0.4, 5.6);
}

function scene2() {
  // the logo reveal and the promise (the page is its own scene)
  const L = $("bg");
  L.style.opacity = 0;
  document.body.style.background = "#FFF6EC";
  const box = document.createElement("div");
  box.style.cssText = "position:absolute;left:0;top:0;width:1280px;height:720px;background:#FFF6EC;overflow:hidden";
  box.innerHTML = `
    <div id="lg" style="position:absolute;left:70px;top:40px;width:490px;opacity:0"><img src="${window.__LOGO}" style="width:490px;display:block"></div>
    <div id="shot" style="position:absolute;left:690px;top:90px;width:520px;height:520px;opacity:0;border:4px solid #1A1A3A;box-shadow:12px 12px 0 #D4106B;overflow:hidden;background:#fff"><img src="${window.__SHOT}" style="width:1040px;margin-left:-520px;margin-top:-10px"></div>
    <div id="chips" style="position:absolute;left:80px;top:590px;display:flex;gap:18px;opacity:0">
      <div style="padding:12px 22px;border:3px solid #1A1A3A;background:#FFC93C;font:900 26px Unbounded,sans-serif">PayPal</div>
      <div style="padding:12px 22px;border:3px solid #1A1A3A;background:#fff;font:900 26px Unbounded,sans-serif">+ AI that proposes</div>
    </div>`;
  $("root").appendChild(box);
  const lg = $("lg"), shot = $("shot"), chips = $("chips");
  at(0.35, () => { anim(lg, [{ opacity: 0, transform: "scale(.7)" }, { opacity: 1, transform: "scale(1)" }], 0.9, { easing: "cubic-bezier(.2,1.4,.4,1)" }); cue("sparkle", 0.4, 1); cue("whoosh", 0.3, 0.6); });
  at(TM[1].start, () => { cue("chime", TM[1].start + 0.1, 0.8); });
  at(TM[2].start - 0.2, () => {
    anim(shot, [{ opacity: 0, transform: "translateX(80px)" }, { opacity: 1, transform: "translateX(0)" }], 0.7);
    anim(chips, [{ opacity: 0, transform: "translateY(20px)" }, { opacity: 1, transform: "translateY(0)" }], 0.6);
    cue("pop", TM[2].start, 0.8);
  });
}

/** A full-screen card on its own background (used after the story, for the numbers and for the closing). */
function card(html, bg) {
  $("bg").style.opacity = 0;
  const box = document.createElement("div");
  box.style.cssText = `position:absolute;left:0;top:0;width:1280px;height:720px;overflow:hidden;background:${bg}`;
  box.innerHTML = html;
  $("root").appendChild(box);
  return box;
}

function sceneEval() {
  const rows = [
    ["Grounded answers", "each member's real balance, in USD", 5, 5],
    ["Language", "answers in the member's language", 2, 2],
    ["Prompt injection", "planted instructions are not obeyed", 3, 3],
    ["Reminders", "the model never writes an amount", 8, 8],
    ["Form filling", "never invents what the text does not say", 4, 4],
  ];
  card(`
    <div style="position:absolute;left:90px;top:52px;font:900 44px Unbounded,sans-serif;color:#1A1A3A">The AI, measured</div>
    <div id="rows" style="position:absolute;left:90px;top:150px;width:1100px"></div>
    <div id="total" style="position:absolute;right:90px;top:46px;opacity:0;font:900 64px Unbounded,sans-serif;color:#0E9A64">22 / 22</div>`, "#FFF6EC");
  rows.forEach(([name, what, ok, n], i) => {
    const r = document.createElement("div");
    r.style.cssText = "display:flex;align-items:center;gap:22px;margin-bottom:20px;opacity:0;border:3px solid #1A1A3A;background:#fff;padding:14px 22px;box-shadow:6px 6px 0 #29C6E0";
    r.innerHTML = `<div style="flex:1"><div style="font:900 28px Unbounded,sans-serif;color:#1A1A3A">${name}</div><div style="font:700 21px Figtree,sans-serif;color:#4A4766">${what}</div></div><div style="font:900 40px Unbounded,sans-serif;color:#0E9A64">${ok} / ${n}</div>`;
    $("rows").appendChild(r);
    at(0.5 + i * 0.55, () => { anim(r, [{ opacity: 0, transform: "translateX(-40px)" }, { opacity: 1, transform: "translateX(0)" }], 0.5); cue("pop", 0.5 + i * 0.55, 0.6); });
  });
  at(0.5 + rows.length * 0.55 + 0.2, () => { anim($("total"), [{ opacity: 0, transform: "scale(.6)" }, { opacity: 1, transform: "scale(1)" }], 0.7, { easing: "cubic-bezier(.2,1.4,.4,1)" }); cue("chime", 0.5 + rows.length * 0.55 + 0.2, 0.8); });
}

function sceneClose() {
  card(`
    <div id="lg" style="position:absolute;left:0;right:0;top:34px;text-align:center;opacity:0"><img src="${window.__LOGO}" style="width:500px"></div>
    <div id="urls" style="position:absolute;left:0;right:0;top:650px;text-align:center;opacity:0;font:700 26px Figtree,sans-serif;color:#1A1A3A">
      <span style="border:3px solid #1A1A3A;background:#fff;padding:8px 20px;margin:0 10px">ayni.devsjec.com</span>
      <span style="border:3px solid #1A1A3A;background:#fff;padding:8px 20px;margin:0 10px">github.com/JkalasG/ayni</span></div>`, "#FFF6EC");
  at(0.2, () => { anim($("lg"), [{ opacity: 0, transform: "scale(.85)" }, { opacity: 1, transform: "scale(1)" }], 1.0); cue("sparkle", 0.3, 0.9); });
  at(TM[2].start, () => { anim($("urls"), [{ opacity: 0, transform: "translateY(16px)" }, { opacity: 1, transform: "translateY(0)" }], 0.6); cue("chime", TM[2].start + 0.2, 0.7); });
}

window.startScene = function () {
  t0 = performance.now();
  if (SC === "s01-story") scene1();
  else if (SC === "s02-reveal") scene2();
  else if (SC === "card-eval") sceneEval();
  else if (SC === "s11-close") sceneClose();
};
</script>
