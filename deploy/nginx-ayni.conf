# /etc/nginx/sites-available/ayni  (then: ln -s ../sites-available/ayni /etc/nginx/sites-enabled/ayni)
# Start with this plain HTTP block; `certbot --nginx -d ayni.devsjec.com` adds the HTTPS part and the redirect by itself.
server {
    listen 80;
    listen [::]:80;
    server_name ayni.devsjec.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;   # the AI assistant can take a while to answer
    }
}
