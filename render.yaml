# One-click deploy on Render: API + static web build of the app.
# The database is NOT on Render: Render's free Postgres expires after 30 days, before
# judging ends (Dec 21). Use Neon (free, no expiry) and paste its URL in DATABASE_URL.
services:
  - type: web
    name: ayni-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Neon: postgresql://...neon.tech/ayni?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_API_URL
        sync: false # e.g. https://ayni-api.onrender.com
      - key: APP_WEB_URL
        sync: false # e.g. https://ayni-web.onrender.com
      - key: ENABLE_DEMO_LOGIN
        value: "true"
      - key: ALLOW_EXPO_GO
        value: "true"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: DEMO_MEMBER_EMAILS
        sync: false # sandbox personal accounts, only used by `npm run db:seed`

  - type: web
    name: ayni-web
    runtime: static
    rootDir: app
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false # e.g. https://ayni-api.onrender.com
